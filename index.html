<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nin Hao | HSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C1241B;--red2:#9E1B14;--gold:#EDBB2E;--ink:#38383A;--mut:#6b6b72;--line:#e4e4e7;--bg:#f6f6f7;--w:#fff;--lg:none}
:root[data-theme=dark]{--ink:#f2f2f3;--mut:#a1a1aa;--line:#34343a;--bg:#131316;--w:#1c1c20;--red:#D63A30;--red2:#E85A50;--lg:brightness(1.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f2f2f3;--mut:#a1a1aa;--line:#34343a;--bg:#131316;--w:#1c1c20;--red:#D63A30;--red2:#E85A50;--lg:brightness(1.2)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.5 "Noto Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{background:var(--w);border-top:4px solid var(--red);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:flex-end;align-items:center;padding:10px 0 0}.tools{display:flex;gap:8px;align-items:center}
#th{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;font-size:16px;cursor:pointer}
.logo{text-align:center;padding:4px 0 6px}.logo img{width:min(250px,60vw);filter:var(--lg);display:block;margin:0 auto}
.wm{font:700 clamp(30px,7vw,46px)/1.1 Montserrat,"Noto Sans",sans-serif;letter-spacing:.02em;margin-top:2px}
.tg{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;font:600 clamp(11px,2.6vw,14px) Montserrat,"Noto Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.tg i{height:2px;width:clamp(28px,9vw,90px);background:var(--gold)}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:20px}.brand b{color:var(--red);font-size:26px;font-weight:500}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.lang button.on{background:var(--red);color:#fff}
.hero{padding:14px 0 22px;text-align:center}
.hero .big{font-size:76px;line-height:1;color:var(--red);font-weight:500}
.hero h1{margin:0 0 4px;font-size:22px}.hero p{margin:0;color:var(--mut)}
.find{background:var(--w);border-bottom:1px solid var(--line);padding:14px 0;position:sticky;top:0;z-index:5}
.find .wrap{display:flex;gap:10px;flex-wrap:wrap}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--w);color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
#q{flex:2 1 240px}select{flex:1 1 140px}
main{padding:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.card{background:var(--w);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:19px}.lv{color:var(--red);font-weight:700;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}.row b{color:var(--ink);font-weight:500;text-align:right}
.price{font-size:22px;font-weight:700;margin-top:4px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--ink);align-self:flex-start}
.badge.low{background:var(--red);color:#fff}.badge.off{color:var(--mut)}
.btn{margin-top:auto;border:0;border-radius:8px;padding:11px;font:inherit;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
.btn:hover{background:var(--red2)}.card{border-top:3px solid var(--gold)}.btn:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.msg{padding:30px;text-align:center;color:var(--mut)}
.info{background:var(--w);border-top:1px solid var(--line);margin-top:28px;padding:26px 0 34px}
.info h2{margin:0 0 10px;font-size:20px}.info ul{margin:0;padding-left:20px;max-width:760px}.info li{margin:6px 0}
.info .addr{margin-top:16px;color:var(--mut)}
dialog{border:0;border-radius:12px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--w);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:10px}.dlg h2{margin:0;font-size:20px}
.dlg label{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.days{display:flex;flex-wrap:wrap;gap:8px}.days label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}
.days label.t{opacity:.5}.days input{accent-color:var(--red)}
.note{font-size:14px;color:var(--mut)}.err{color:var(--red);font-size:14px;font-weight:500}
.desc{background:var(--bg);border:1px dashed var(--red);border-radius:8px;padding:12px;font-weight:700;word-break:break-word;display:flex;gap:10px;justify-content:space-between;align-items:center}
.desc button{flex:none;border:1px solid var(--line);background:var(--w);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.cd{font-size:22px;font-weight:700;color:var(--red)}
@media(max-width:560px){.hero h1{font-size:19px}}
</style>
</head>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='mn';try{lang=localStorage.getItem('nh')||'mn'}catch(e){}
let data=null,cur=null,tmr=null,errTxt='';const t=k=>T[lang][k],fmt=n=>Number(n).toLocaleString('en-US')+'₮';
const tod=c=>{const h=parseInt(c.startTime);return h<12?'mo':h<17?'af':'ev'};
const grp=c=>c.individual?'':c.daysEn.includes('Sat/Sun')?'wk':c.daysEn.includes('Mon')?'mwf':'tts';
const KW={mo:'morning өглөө',af:'afternoon өдөр үд хойш',ev:'evening орой',wk:'weekend амралт',mwf:'mon wed fri',tts:'tue thu sat'};
const hay=c=>(c.nameEn+' '+c.nameMn+' '+c.level+' '+c.daysEn+' '+c.daysMn+' '+KW[tod(c)]+' '+(KW[grp(c)]||'')+(c.individual?' individual ганцаарчилсан':'')).toLowerCase();
const norm=s=>s.toLowerCase().replace(/\s+/g,'');
function setLang(l){lang=l;try{localStorage.setItem('nh',l)}catch(e){}document.documentElement.lang=l;
document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l==l));
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
$('#q').placeholder=t('ph');
const fv=[$('#fl').value,$('#fd').value,$('#ft').value];
const fill=(id,o)=>{$(id).innerHTML=o.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')};
fill('#fl',[['',t('al')],['HSK1','HSK1'],['HSK2','HSK2'],['HSK3','HSK3'],['HSK4','HSK4'],['INDIV',t('ind')]]);
fill('#fd',[['',t('ad')],['mwf',t('mwf')],['tts',t('tts')],['wk',t('wk')]]);
fill('#ft',[['',t('at')],['mo',t('mo')],['af',t('af')],['ev',t('ev')]]);
$('#fl').value=fv[0];$('#fd').value=fv[1];$('#ft').value=fv[2];
$('#rules').innerHTML=t('r').map(x=>`<li>${esc(x)}</li>`).join('');
$('#addr').innerHTML=esc(t('ad2'))+'<br>'+t('tel')+': <a href="tel:72663888">72663888</a>';
if($('#dlg').open)$('#dlg').close();render()}
function render(){const L=$('#list');
if(!data){L.innerHTML=`<div class="msg" style="grid-column:1/-1">${t('load')}</div>`;return}
if(data==='err'){L.innerHTML=`<div class="msg" style="grid-column:1/-1">${t('fail')}<br><small style="word-break:break-all">${esc(errTxt)}</small><br><br><button class="btn" id="rt">${t('retry')}</button></div>`;$('#rt').onclick=load;return}
const q=norm($('#q').value),fl=$('#fl').value,fd=$('#fd').value,ft=$('#ft').value;
const rows=data.classes.filter(c=>(!q||norm(hay(c)).includes(q))&&(!fl||(fl=='INDIV'?c.individual:c.level==fl))&&(!fd||grp(c)==fd)&&(!ft||tod(c)==ft));
if(!rows.length){L.innerHTML=`<div class="msg" style="grid-column:1/-1">${t('none')}</div>`;return}
L.innerHTML=rows.map(c=>{const mn=lang=='mn',i=c.individual;
let b='',dis=false;
if(!i){if(c.status=='closed'){b=`<span class="badge off">${t('closed')}</span>`;dis=true}else if(c.status=='full'){b=`<span class="badge off">${t('full')}</span>`;dis=true}else b=`<span class="badge ${c.seatsLeft<=2?'low':''}">${t('left')(c.seatsLeft)}</span>`}
return `<div class="card"><span class="lv">${esc(c.level)}</span><h3>${esc(mn?c.nameMn:c.nameEn)}</h3>${b}
<div class="row"><span>${esc(mn?c.daysMn:c.daysEn)}</span><b>${esc(c.startTime)}-${esc(c.endTime)}</b></div>
<div class="row"><span>${c.sessions} ${t('ses')}</span>${i?'':`<b>${esc(c.startDate)} → ${esc(c.endDate)}</b>`}</div>
<div class="price">${fmt(c.price)}</div>
<div class="row"><span>${t('dep')}</span><b>${fmt(c.deposit)}</b></div><div class="row"><span>${t('bal')}</span><b>${fmt(c.balance)}</b></div>
<button class="btn" data-id="${esc(c.id)}" ${dis?'disabled':''}>${dis?(c.status=='full'?t('full'):t('closed')):i?t('pick'):t('book')}</button></div>`}).join('');
L.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openBook(data.classes.find(c=>c.id==b.dataset.id)))}
async function load(){data=null;errTxt='';render();try{data=await jp({action:'classes'});if(!data.ok)throw new Error('Script said: '+(data.message||data.code))}catch(e){console.error('Nin Hao load error',e);errTxt=String(e&&e.message||e);data='err'}render()}
function jp(q){return new Promise((res,rej)=>{const n='nh'+Math.random().toString(36).slice(2),s=document.createElement('script'),to=setTimeout(()=>{cl();rej(new Error('timeout'))},25000);
function cl(){clearTimeout(to);delete window[n];s.remove()}
window[n]=d=>{cl();res(d)};s.onerror=()=>{cl();rej(new Error('script blocked or offline'))};
s.src=API+'?'+new URLSearchParams({...q,callback:n});document.head.appendChild(s)})}
const today=()=>new Date(Date.now()+8*36e5).toISOString().slice(0,10);
function openBook(c){cur=c;const mn=lang=='mn',i=c.individual;
$('#dbody').innerHTML=`<h2>${esc(mn?c.nameMn:c.nameEn)}</h2><div class="note">${fmt(c.price)} · ${t('dep')}: ${fmt(c.deposit)}</div>
<label>${t('nm')}<input id="bn" maxlength="60" autocomplete="name" required></label>
<label>${t('ph8')}<input id="bp" inputmode="numeric" maxlength="12" autocomplete="tel" required></label>
<label>${t('em')}<input id="be" type="email" autocomplete="email" required></label>
${i?`<label>${t('lvl')}<select id="bl"><option>HSK1</option><option>HSK2</option><option>HSK3</option><option>HSK4</option></select></label>
<label>${t('sd')}<input id="bs" type="date" min="${today()}"></label>
<div class="note">${t('dy')}</div><div class="days" id="bd"></div><div class="note" id="bi"></div>`:''}
<div class="err" id="be2"></div>
<button class="btn" id="go">${t('go')}</button><button class="btn ghost" id="cl">${t('cancel')}</button>`;
$('#cl').onclick=()=>$('#dlg').close();$('#go').onclick=submit;
if(i){$('#bs').onchange=days;drawDays({})}
$('#dlg').showModal()}
function drawDays(m){$('#bd').innerHTML=Object.keys(T.en.D).map(d=>`<label class="${m[d]&&m[d].taken?'t':''}"><input type="checkbox" value="${d}" ${m[d]&&m[d].taken?'disabled':''}>${t('D')[d]}${m[d]&&m[d].taken?' ('+t('tk')+')':''}</label>`).join('');
$('#bd').querySelectorAll('input').forEach(x=>x.onchange=check)}
async function days(){const s=$('#bs').value;if(!s)return;try{const r=await jp({action:'indiv_days',start:s});if(r.ok)drawDays(r.days)}catch(e){}check()}
const picked=()=>[...document.querySelectorAll('#bd input:checked')].map(x=>x.value);
async function check(){const s=$('#bs').value,d=picked(),o=$('#bi');o.className='note';o.textContent='';if(!s||!d.length)return;
try{const r=await jp({action:'indiv_check',start:s,days:d.join(',')});
if(r.ok){if(r.free)o.textContent=t('endsOn')+': '+r.endDate;else{o.className='err';o.textContent=t('clash')}}}catch(e){}}
async function submit(){const b=$('#go'),er=$('#be2');er.textContent='';
const name=$('#bn'),phone=$('#bp'),email=$('#be');
if(!name.reportValidity()||!phone.reportValidity()||!email.reportValidity())return;
if(cur.individual&&(!$('#bs').value||!picked().length)){er.textContent=t('e').NO_DAYS;return}
b.disabled=true;b.textContent=t('wait');
const p={action:'book',classId:cur.id,name:$('#bn').value,phone:$('#bp').value,email:$('#be').value};
if(cur.individual){p.level=$('#bl').value;p.start=$('#bs').value;p.days=picked().join(',')}
try{const r=await jp(p);
if(r.ok){done(r);load();return}er.textContent=t('e')[r.code]||t('e').X;if(r.code=='FULL'||r.code=='CLOSED')load()}
catch(e){er.textContent=t('e').X}b.disabled=false;b.textContent=t('go')}
function done(r){const a=r.account.replace(/(.{4})/g,'$1 ').trim();
$('#dbody').innerHTML=`<h2>${t('ok')}</h2><div class="note">${esc(r.bookingId)} · ${esc(lang=='mn'?r.classNameMn:r.classNameEn)}</div>
<p>${esc(t('pay')(fmt(r.deposit),r.bank,a,r.holder))}</p>
<div class="desc"><span id="ds">${esc(r.description)}</span><button id="cp">${t('copy')}</button></div>
<p class="note">${esc(t('after')(fmt(r.balance)))}</p><div class="note">${esc(t('hold')(r.holdHours))}</div><div class="cd" id="cd"></div>
<button class="btn ghost" id="cl">${t('cancel')}</button>`;
$('#cl').onclick=()=>$('#dlg').close();
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(r.description)}catch(e){const s=getSelection(),g=document.createRange();g.selectNode($('#ds'));s.removeAllRanges();s.addRange(g);document.execCommand('copy')}$('#cp').textContent=t('copied')};
const end=new Date(r.holdExpires.replace(' ','T')+':00+08:00').getTime();clearInterval(tmr);
const tick=()=>{const s=Math.floor((end-Date.now())/1e3);if(s<=0){$('#cd').textContent=t('exp');clearInterval(tmr);return}
const p=n=>String(n).padStart(2,'0');$('#cd').textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`};tick();tmr=setInterval(tick,1e3)}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
['#q','#fl','#fd','#ft'].forEach(s=>$(s).addEventListener('input',render));\n['#fl','#fd','#ft'].forEach(s=>$(s).addEventListener('change',render));
try{const v=localStorage.getItem('nht');if(v)document.documentElement.dataset.theme=v}catch(e){}
$('#th').onclick=()=>{const d=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=d=='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('nht',n)}catch(e){}};
setLang(lang);load();
</script>
</body>
</html>
